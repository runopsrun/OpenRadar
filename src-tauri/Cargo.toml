[package]
name = "openradar"
version = "0.1.0"
description = "A lightweight, open-source desktop weather radar viewer"
authors = ["OpenRadar contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "openradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
